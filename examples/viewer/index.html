<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Globes</title>
    <style>
      body {
        margin: 0;
        background: #101218;
        color: #e8ebf2;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      canvas {
        display: block;
      }
      .panel {
        position: fixed;
        z-index: 2;
        top: 16px;
        left: 16px;
        width: 240px;
        max-height: calc(100vh - 32px);
        overflow: auto;
        padding: 16px;
        background: #191e2bee;
        border: 1px solid #414a60;
        border-radius: 8px;
      }
      .places {
        position: fixed;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        pointer-events: none;
      }
      /* CSS2DRenderer positions labels; these only style them. */
      .place {
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #f4f7fb;
        font-size: 12px;
        line-height: 1.2;
        white-space: nowrap;
        text-shadow:
          0 1px 2px #000,
          0 0 2px #000;
      }
      .place::after {
        content: "";
        width: 6px;
        height: 6px;
        margin-top: 2px;
        border-radius: 50%;
        background: var(--dot, currentColor);
        box-shadow: 0 0 0 1px #101218;
      }
      .panel button {
        border: 1px solid #61728d;
        border-radius: 6px;
        background: #293c54;
        color: #eff7ff;
        padding: 5px 8px;
        cursor: pointer;
        font: inherit;
        margin: 0 6px 8px 0;
      }
      .panel button[aria-pressed="false"] {
        background: #141924;
        border-color: #3b4352;
        color: #a1aaba;
      }
      .panel p {
        margin: 10px 0;
      }
      .panel small {
        display: block;
        color: #b4bed1;
      }
      #startup-status {
        position: fixed;
        inset: 40% 0 auto;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <p id="startup-status" role="status">Loading globe code…</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
